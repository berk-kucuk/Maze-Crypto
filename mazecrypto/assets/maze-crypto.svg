<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Maze Crypto: open maze frame (Maze family) + three rising candles,
       the last one lit in the app's champagne accent and leaving through the gap. -->
  <defs>
    <radialGradient id="glow" cx="664" cy="414" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9d8b4" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#e9d8b4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e9d8b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e2"/>
      <stop offset="1" stop-color="#d9c08e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#000"/>

  <circle cx="664" cy="414" r="230" fill="url(#glow)"/>

  <!-- frame, open on the right like the other Maze marks -->
  <path d="M812 300 V212 H212 V812 H812 V530" fill="none" stroke="#f2f2f4" stroke-width="50"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- candle 1 -->
  <rect x="353" y="548" width="14" height="196" fill="#f2f2f4"/>
  <rect x="328" y="584" width="64" height="120" fill="#f2f2f4"/>
  <!-- candle 2 -->
  <rect x="505" y="420" width="14" height="236" fill="#f2f2f4"/>
  <rect x="480" y="466" width="64" height="148" fill="#f2f2f4"/>
  <!-- candle 3, lit -->
  <rect x="657" y="290" width="14" height="252" fill="url(#lit)"/>
  <rect x="632" y="326" width="64" height="176" fill="url(#lit)"/>
</svg>
